name: rookit_mainhub_api

services:
  # Replaces the old "mongodb" service. Unlike Mongo, which just needs a data
  # directory, Postgres needs a database/user created up front - POSTGRES_DB/
  # POSTGRES_USER/POSTGRES_PASSWORD do that on first container start.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mainhub
      POSTGRES_USER: mainhub
      POSTGRES_PASSWORD: mainhub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mounting our schema file here makes Postgres run it automatically,
      # exactly once, the first time the data volume is empty - this is what
      # creates the tables/indexes from db/init.sql (there's no separate
      # "migration" step to run by hand for this project).
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # pg_isready checks that Postgres has actually finished starting up and can
    # accept connections. mainhub-api's "depends_on: condition: service_healthy"
    # below waits for this to pass before starting the app, so the app doesn't
    # try to connect before the database (and its schema) is ready.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mainhub -d mainhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  mainhub-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5001
      # Replaces the old MongoDbSettings__* env vars (connection string, db
      # name, etc. as separate settings) with a single ADO.NET-style Postgres
      # connection string, read by Program.cs via
      # builder.Configuration.GetConnectionString("Main").
      - ConnectionStrings__Main=Host=postgres;Port=5432;Database=mainhub;Username=mainhub;Password=mainhub
      # Override MinioSettings__Endpoint for the compose network - inside the
      # network the app reaches Minio via the service name, not localhost.
      - MinioSettings__Endpoint=minio:9000
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # S3-compatible object storage. The console (port 9001) is exposed for local
  # debugging; the S3 API lives on port 9000. Credentials here must match the
  # MinioSettings AccessKey/SecretKey in appsettings.json (or the app's env
  # overrides above).
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mainhub
      MINIO_ROOT_PASSWORD: mainhub-minio-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command: http mainhub-api:5001 --url=https://scaling-sediment-automated.ngrok-free.dev
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - mainhub-api

volumes:
  postgres_data:
  minio_data:
