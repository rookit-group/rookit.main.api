name: caramob

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mainhub
      POSTGRES_USER: mainhub
      POSTGRES_PASSWORD: mainhub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mainhub -d mainhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  mainhub-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5001
      - ConnectionStrings__Main=Host=postgres;Port=5432;Database=mainhub;Username=mainhub;Password=mainhub
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command: http mainhub-api:5001 --url=https://scaling-sediment-automated.ngrok-free.dev
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - mainhub-api

volumes:
  postgres_data:
